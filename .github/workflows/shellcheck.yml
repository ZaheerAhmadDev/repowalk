name: ShellCheck

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'
          ignore_paths: 'target'
