name: CSS Lint

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  csslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install stylelint
        run: npm install --no-save --silent stylelint stylelint-config-standard
      - name: Run stylelint
        run: npx stylelint "site/**/*.css"
