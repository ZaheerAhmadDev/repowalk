name: Cargo fmt (extra)

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  fmt2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
