[files]
extend-exclude = [
  "vendor/",
  "target/",
  "andrej-karpathy-skills-main/",
]

[default]
# Commit hashes such as `15e22ba` contain hex fragments typos would flag.
extend-ignore-re = ["\\b[0-9a-f]{7,40}\\b"]

[default.extend-words]
ratatui = "ratatui"
unparseable = "unparseable"
FoO = "FoO"
Fo = "Fo"
# Level of detail (graph zoom labels).
LOD = "LOD"
# As in "mis-scoped" / "mis-configured".
mis = "mis"

[default.extend-identifiers]
# Node-variable abbreviation used throughout the diagrams UI.
nd = "nd"
