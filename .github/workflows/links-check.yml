name: Links Check

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-path target --exclude-path vendor --verbose '*.md' 'site/**/*.html'
