name: Release Dry Run

on:
  push:
    tags-ignore: ['*']
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --workspace --release --locked
