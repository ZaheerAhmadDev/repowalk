name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare deploy root (ensure index.html at artifact root)
        run: |
          rm -rf .deploy_root
          mkdir -p .deploy_root

          if [ -f "site/index.html" ]; then
            echo "index.html found at site/"
            cp -a site/. .deploy_root/
          elif [ -f "site/dist/index.html" ]; then
            echo "index.html found at site/dist/"
            cp -a site/dist/. .deploy_root/
          elif [ -f "site/site/index.html" ]; then
            echo "index.html found at site/site/"
            cp -a site/site/. .deploy_root/
          else
            echo "Error: index.html not found under site/, site/dist/, or site/site/ — listing site/ for debug:" >&2
            ls -la site || true
            exit 1
          fi

          echo "Contents of .deploy_root (top-level):"
          ls -la .deploy_root
          find .deploy_root -maxdepth 2 -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy_root

      - id: deployment
        uses: actions/deploy-pages@v5
